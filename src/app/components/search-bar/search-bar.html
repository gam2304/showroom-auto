<div class="container1">
    <label></label>
    <input type="text" #brand
    (input)="selectAutos(brand.value)" placeholder="Search by brand...">
    <fa-icon [icon]="faMagnifyingGlass"/>
</div>

<div class="container">
    @for(auto of selectedAutos; track auto.id){
        <div class="auto-card">
            <img [src]="`images/${auto.photo}`">
            <div class="details">
                <h3>{{auto.brand}} {{auto.model}}</h3>
                <p>
                    Power : {{auto.power}} HP <br>
                    Price : {{auto.price}} 000 TND<br>
                    Only {{auto.availability}} units left in stock
                </p>
            </div>
            <div class="see_more">
            <button (click)="selectCar(auto)">See more...</button>
            </div>
        </div>
    }
</div>
